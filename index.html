<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#160006">
<title>My Dear Queen Tazmim</title>
<style>
:root{--red:#ff1744;--deep:#5d0018;--gold:#ffd36b;--white:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font-family:Georgia,"Times New Roman",serif;background:#100006 url("assets/romantic-red-background.png") center/cover fixed no-repeat;overflow-x:hidden;display:flex;flex-direction:column;min-height:100vh}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(120deg,rgba(12,0,4,.48),rgba(50,0,15,.62));z-index:-1}
.page{flex:1 0 auto;padding:28px 18px 20px;position:relative;display:flex;flex-direction:column;align-items:center}
.hidden{display:none!important}
h1{font-size:clamp(2rem,5vw,4.3rem);text-align:center;margin:18px 0 12px;color:#ffccd5;text-shadow:0 0 8px #ff003c,0 0 22px #b00030;letter-spacing:1px}
#welcome{justify-content:flex-start}
#welcome h1{margin:18px 0 12px;animation:fadeUp 1s both}
.subtitle{font-size:clamp(1.3rem,3vw,2rem);font-weight:bold;letter-spacing:1px;text-align:center;margin:clamp(34px,7vh,70px) 0 clamp(26px,5vh,46px);background:linear-gradient(90deg,#ffd36b,#ffb1c5,#ffd36b);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 10px rgba(255,170,60,.55));animation:fadeUp 1s .5s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.instructions{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;line-height:1.7;color:white;font-family:Georgia,"Times New Roman",serif;font-size:1.15rem;font-weight:normal;margin:0 auto;text-shadow:0 2px 10px #000;animation:fadeUp 1s 1.1s both}
.instructions .or{color:#ffd36b;font-weight:bold;letter-spacing:3px}
.actions{display:flex;gap:22px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:10px;padding:10px 0 20px;animation:fadeUp 1s 2.1s both}
.ecg{width:min(92vw,640px);height:auto;margin:clamp(50px,10vh,110px) auto clamp(30px,7vh,80px);overflow:visible;animation:fadeUp 1s 1.8s both}
.ecg path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ecg .base{stroke:#ff1744;stroke-opacity:.2;stroke-width:2.5}
.ecg .live{stroke:#ff1744;stroke-width:3.5;stroke-dasharray:100;stroke-dashoffset:100;filter:drop-shadow(0 0 6px #ff1744) drop-shadow(0 0 14px #ff0044);animation:ecgRun 3.6s 2.4s linear infinite}
@keyframes ecgRun{0%{stroke-dashoffset:100;opacity:1}75%{stroke-dashoffset:0;opacity:1}90%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:100;opacity:0}}
.btn{border:1px solid rgba(255,255,255,.65);border-radius:999px;padding:14px 42px;font-size:1.15rem;font-weight:bold;letter-spacing:1px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#ff1744,#9c0030,#ff7b9b);box-shadow:0 0 18px #ff1744;transition:.25s;animation:pulse 2s infinite}
.btn.close{background:linear-gradient(135deg,#3b3b55,#171725,#7b2940);box-shadow:0 0 16px #a8a8d0}
.btn:hover{transform:translateY(-4px) scale(1.04)}
@keyframes pulse{50%{filter:brightness(1.3);box-shadow:0 0 28px #ff1744}}
.music{position:relative;flex:none;align-self:center;margin:6px auto 14px;z-index:20;display:flex;align-items:center;gap:20px;padding:0;background:none;border:0;box-shadow:none}
.music button{display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid rgba(255,130,160,.45);border-radius:50%;background:rgba(255,23,68,.10);color:#ffc2d1;cursor:pointer;box-shadow:0 0 12px rgba(255,23,68,.35);transition:.25s}
.music button svg{width:46%;height:46%;fill:currentColor;filter:drop-shadow(0 0 4px rgba(255,23,68,.8))}
.music button:hover{transform:scale(1.12);background:rgba(255,23,68,.28);color:#fff;box-shadow:0 0 20px #ff1744}
.music button:active{transform:scale(.94)}
.music #toggleSong{width:54px;height:54px;border:0;color:#fff;background:linear-gradient(135deg,#ff1744,#a8002e);box-shadow:0 0 18px #ff1744;animation:pulse 2s infinite}
.music button:disabled{opacity:.35;cursor:not-allowed}
#musicStatus{display:none!important}
.petal{position:fixed;top:-45px;z-index:2;pointer-events:none;font-size:20px;animation:fall linear forwards;filter:drop-shadow(0 0 5px #ff1744)}
@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(720deg);opacity:.15}}
.dead{font-size:clamp(1.7rem,5vw,3.4rem);color:#ff9ab0;text-align:center;text-shadow:0 0 20px red;margin:auto}
#surprise{width:min(100%,1250px);max-width:1250px;margin-inline:auto}
.game-title{margin:2px 0 24px;width:100%;text-align:center}
.game-layout{display:grid;grid-template-columns:minmax(300px,1fr) minmax(280px,.95fr);gap:clamp(20px,4vw,55px);width:min(100%,1120px);margin-inline:auto;align-items:center;justify-content:center}
.machine{position:relative;background:linear-gradient(160deg,rgba(52,8,28,.85),rgba(16,2,9,.92));border:1px solid rgba(255,125,165,.55);border-radius:28px;padding:clamp(12px,2vw,22px);box-shadow:inset 0 0 30px rgba(255,23,68,.12),0 0 30px rgba(255,23,68,.35),0 18px 50px rgba(0,0,0,.55);backdrop-filter:blur(6px)}
.machine:before{content:"";position:absolute;inset:6px;border:1px solid rgba(255,211,107,.22);border-radius:22px;pointer-events:none}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(95px,1fr));gap:clamp(8px,1.2vw,14px);align-items:stretch}
.slot{aspect-ratio:1/1.12;min-width:0;background:radial-gradient(circle at 30% 18%,#4d1638,#14060f 70%);border:1px solid rgba(255,125,165,.45);border-radius:16px;box-shadow:inset 0 0 16px rgba(255,23,68,.18);overflow:hidden;position:relative;display:grid;place-items:center}
.slot:nth-child(1){grid-area:1/1}
.slot:nth-child(2){grid-area:1/2}
.slot:nth-child(3){grid-area:1/3}
.slot:nth-child(4){grid-area:2/3}
.slot:nth-child(5){grid-area:3/3}
.slot:nth-child(6){grid-area:3/2}
.slot:nth-child(7){grid-area:3/1}
.slot:nth-child(8){grid-area:2/1}
#spinBtn{grid-area:2/2;align-self:center;justify-self:center;width:100%;max-width:110px;min-height:44px;padding:5px 4px;font-size:clamp(.8rem,1.4vw,1rem);border:1px solid #fff2bd;border-radius:14px;background:linear-gradient(135deg,#ffe58a,#ffad1f 60%,#ff6a3c);color:#3a1000;font-weight:900;letter-spacing:1.5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 0 24px rgba(255,176,0,.75);cursor:pointer;animation:pulse 1.8s infinite}
#spinBtn:disabled{opacity:.7;cursor:wait}
.slot img{width:100%;height:100%;object-fit:cover;filter:brightness(.12) saturate(.4);transition:filter .3s}
.slot .veil{position:absolute;inset:0;display:grid;place-items:center;background:none;color:#ff6f95;font:700 clamp(1.3rem,3vw,2rem) Arial;text-shadow:0 0 12px #ff1744;animation:softBeat 2.4s ease-in-out infinite}
@keyframes softBeat{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.18);opacity:1}}
.slot:nth-child(2n) .veil{animation-delay:.6s}.slot:nth-child(3n) .veil{animation-delay:1.2s}
.slot.revealed img{filter:none}
.slot.revealed .veil{display:none}
.slot.active{z-index:2;border:2px solid #ffe18b;box-shadow:0 0 18px #ffb000, inset 0 0 12px #ffb000;transform:scale(1.045)}
.slot.active img{filter:brightness(.55) saturate(1.2)}
.slot.revealed{border:2px solid #ffb1c5;box-shadow:0 0 14px #ff1744}
.spin-wrap{display:flex;justify-content:center;padding:14px 0 5px}
.spin{border:2px solid #ffe18b;border-radius:5px;padding:12px 48px;font:bold 1.3rem Arial;color:#321000;background:linear-gradient(#ffe57b,#ff9d00);box-shadow:0 0 18px #ffb000;cursor:pointer}
.spin:disabled{opacity:.5;cursor:wait}
.viewer{display:flex;flex-direction:column;align-items:center;gap:16px}
.photo-frame{position:relative;width:min(100%,440px);min-width:0;aspect-ratio:4/5;border:2px solid rgba(255,255,255,.55);border-radius:24px;padding:7px;background:linear-gradient(135deg,#ff1744,#ffd36b,#ff6b8e,#ff1744,#ffd36b);background-size:300% 300%;animation:frameShine 7s linear infinite;box-shadow:0 0 30px rgba(255,23,68,.65),0 18px 50px rgba(0,0,0,.55);perspective:1000px}
@keyframes frameShine{0%{background-position:0 50%}100%{background-position:300% 50%}}
.photo-frame:after{content:"\2764";position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:30px;height:30px;line-height:30px;text-align:center;font-size:15px;color:#ff4d73;background:#1c000e;border:1px solid #ffb1c5;border-radius:50%;box-shadow:0 0 14px #ff1744;font-family:Arial,sans-serif;animation:softBeat 1.6s ease-in-out infinite}
.photo-inner{width:100%;height:100%;border-radius:17px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#2a0618,#080004 80%);box-shadow:inset 0 0 28px rgba(0,0,0,.7);display:grid;place-items:center;min-width:0}
.photo-inner img{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;animation:flipIn .85s both}
@keyframes flipIn{from{transform:rotateY(90deg) scale(.8);opacity:0}to{transform:rotateY(0) scale(1);opacity:1}}
.namebox{width:min(100%,440px);text-align:center;padding:13px 18px;border-radius:999px;border:1px solid rgba(255,154,182,.65);background:linear-gradient(135deg,rgba(60,6,30,.8),rgba(20,0,10,.85));color:#ffe2eb;font-size:clamp(1rem,2vw,1.3rem);letter-spacing:.5px;box-shadow:0 0 18px rgba(255,23,68,.5);overflow-wrap:anywhere}
.hint{font:14px Arial;color:#ffe0e9;text-align:center;margin:8px 0}
@media(max-width:760px){.game-layout{grid-template-columns:1fr}.machine{order:2}.viewer{order:1}.photo-frame,.namebox{width:min(74vw,310px)}.namebox{font-size:1rem;padding:9px 8px}.viewer{gap:10px}.page{padding-top:16px}}
@media(max-width:700px){
  .game-layout{grid-template-columns:minmax(0,1fr);width:min(100%,520px)}
  .machine{width:100%;box-sizing:border-box}
  .slots{grid-template-rows:repeat(3,minmax(64px,1fr));gap:6px}
  #spinBtn{min-height:34px;max-width:74px;font-size:.72rem;padding:3px;border-width:2px;border-radius:8px}
  .game-layout{width:min(100%,400px);gap:16px}
  .machine{padding:10px;border-radius:22px}
  .game-title{margin-bottom:12px}
}

/* ---- Phone: whole 2nd page always fits the real visible screen height ---- */
:root{--app-h:100vh}
@media(max-width:760px){
  #surprise{height:var(--app-h);min-height:0;padding:8px 10px;overflow:hidden;justify-content:flex-start;gap:0}
  .game-title{font-size:1.4rem;line-height:34px;height:34px;margin:0 0 8px;overflow:hidden}
  .game-layout{grid-template-columns:minmax(0,1fr);width:100%;gap:8px;align-items:start}
  .viewer{gap:8px}
  .photo-frame{width:auto;max-width:88vw;border-radius:20px;height:calc(var(--app-h)*.70 - 172px);padding:5px;border-width:2px}
  .namebox{width:min(88vw,340px);height:36px;line-height:36px;padding:0 10px;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .machine{width:min(94vw,calc(var(--app-h)*.345 + 16px));margin-inline:auto;padding:8px;border-radius:18px}
  .slots{height:calc(var(--app-h)*.30);grid-template-rows:repeat(3,minmax(0,1fr));gap:5px}
  .slot{aspect-ratio:auto;min-height:0;border-radius:10px}
  .slot .veil{font-size:1.1rem}
  .music{margin:6px auto 8px;gap:18px}
  .music button{width:38px;height:38px}
  .music #toggleSong{width:46px;height:46px}
}
</style>
</head>
<body>
<section id="welcome" class="page">
  <h1>My Dear Queen Tazmim</h1>
  <p class="subtitle">Are You Ready For this Surprised</p>
  <div class="instructions">
    <div>If you are ready for the surprise, click the Start button</div>
    <div class="or">Or</div>
    <div>If you are not ready for the surprise, click the Close button</div>
  </div>
  <svg class="ecg" viewBox="0 0 600 100" aria-hidden="true">
    <path class="base" d="M0,50 H40 L48,42 L56,52 H80 L88,58 L100,8 L114,90 L124,50 H150 Q165,34 180,50 H280 H300 L308,42 L316,52 H340 L348,58 L360,8 L374,90 L384,50 H410 Q425,34 440,50 H600"/>
    <path class="live" pathLength="100" d="M0,50 H40 L48,42 L56,52 H80 L88,58 L100,8 L114,90 L124,50 H150 Q165,34 180,50 H280 H300 L308,42 L316,52 H340 L348,58 L360,8 L374,90 L384,50 H410 Q425,34 440,50 H600"/>
  </svg>
  <div class="actions">
    <button class="btn" id="startBtn">✦ START ✦</button>
    <button class="btn close" id="closeBtn">CLOSE</button>
  </div>
</section>

<section id="deadPage" class="page hidden">
  <div class="dead">Website is Dead plz Exit</div>
</section>

<section id="surprise" class="page hidden">
  <h1 class="game-title">I Love You Jan</h1>
  <div class="game-layout">
    <div class="machine">
      <div class="slots" id="slots"></div>
    </div>
    <div class="viewer">
      <div class="photo-frame"><div class="photo-inner" id="photoInner"><span style="color:#ffb1c5;text-align:center;padding:20px">Your surprise photo will appear here ❤️</span></div></div>
      <div class="namebox" id="imageName">A special surprise for you</div>
    </div>
  </div>
</section>

<div id="musicStatus" aria-hidden="true"></div>
<div class="music" aria-label="Music controls">
  <button id="prevSong" title="Previous song" aria-label="Previous song"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.5v14H6zM20 5v14L9.5 12z"/></svg></button>
  <button id="toggleSong" title="Play or pause" aria-label="Play or pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg></button>
  <button id="nextSong" title="Next song" aria-label="Next song"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5H18v14h-2.5zM4 5v14l10.5-7z"/></svg></button>
</div>
<audio id="audio" preload="none"></audio>

<script>
function setAppH(){document.documentElement.style.setProperty("--app-h",(window.innerHeight-(window.innerWidth<=760?64:0))+"px");}
setAppH();
window.addEventListener("resize",setAppH);
window.addEventListener("orientationchange",()=>setTimeout(setAppH,250));
// File list is maintained in assets.json at the repository root.
const ASSETS_FILE = "assets.json";
const FALLBACK_PICTURES = [];
const FALLBACK_SONGS = [];

const $ = id => document.getElementById(id);
let picturePool = [], visibleSlots = [], currentSongIndex = 0, songs = [], currentImage = null;
let busy = false;
const audio = $("audio");
const ICON_PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h4v15H6zM14 4.5h4v15h-4z"/></svg>';

function startPetals(){
  setInterval(()=>{
    const p=document.createElement("div"); p.className="petal";
    p.textContent=Math.random()>.3?"🌹":"🌸";
    p.style.left=Math.random()*100+"vw";
    p.style.fontSize=(13+Math.random()*20)+"px";
    p.style.animationDuration=(6+Math.random()*7)+"s";
    p.style.setProperty("--drift",(Math.random()*180-90)+"px");
    document.body.appendChild(p); setTimeout(()=>p.remove(),14000);
  },380);
}
startPetals();

const cleanName = path => {
  let file = String(path).split(/[\\/]/).pop().split("?")[0].split("#")[0];
  try{ file = decodeURIComponent(file); }catch(e){}
  return file.replace(/\.[A-Za-z0-9]{1,6}$/, "").trim();
};
async function loadAssetList(){
  const response = await fetch(ASSETS_FILE, { cache: "no-store" });
  if(!response.ok) throw new Error("Could not load assets.json. Check that it is in the repository root.");
  const data = await response.json();
  const resolveItems = (items=[]) => items
    .filter(path => typeof path === "string" && path.trim())
    .map(path => ({ name: cleanName(path), url: new URL(path, document.baseURI).href }));
  return { pictures: resolveItems(data.pictures), songs: resolveItems(data.songs) };
}
let assetListPromise = null;
function getAssetList(){
  if(!assetListPromise) assetListPromise = loadAssetList();
  return assetListPromise;
}
async function loadPictures(){
  try{
    const assets = await getAssetList();
    picturePool = assets.pictures;
  }catch(e){
    console.warn(e);
    picturePool = FALLBACK_PICTURES.map(url=>({name:cleanName(url),url}));
  }
  picturePool.sort(()=>Math.random()-.5);
  visibleSlots=picturePool.splice(0,8);
  renderSlots();
}
function renderSlots(){
  const container=$("slots");
  container.innerHTML="";
  visibleSlots.forEach((item,i)=>{
    const slot=document.createElement("div");
    slot.className="slot"+(currentImage&&currentImage.url===item.url?" revealed":"");
    const veil=document.createElement("div"); veil.className="veil"; veil.textContent="❤";
    slot.append(veil);
    if(currentImage&&currentImage.url===item.url){
      const img=document.createElement("img"); img.src=item.url; img.alt=item.name;
      slot.prepend(img);
    }
    container.appendChild(slot);
  });
  for(let i=visibleSlots.length;i<8;i++){
    const slot=document.createElement("div");
    slot.className="slot";
    slot.innerHTML='<div class="veil">❤</div>';
    container.appendChild(slot);
  }
  const spinButton=document.createElement("button");
  spinButton.className="spin";
  spinButton.id="spinBtn";
  spinButton.textContent="✦ SPIN ✦";
  spinButton.disabled=busy;
  spinButton.addEventListener("click",spin);
  container.appendChild(spinButton);
}
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

async function spin(){
  if(busy)return;

  // On the next spin, retire the previously revealed picture and refill its slot.
  if(currentImage){
    const previousIndex = visibleSlots.findIndex(item => item.url === currentImage.url);
    if(previousIndex !== -1){
      visibleSlots.splice(previousIndex,1);
      if(picturePool.length) visibleSlots.splice(previousIndex,0,picturePool.shift());
    }
    currentImage = null;
    $("photoInner").innerHTML='<span style="color:#ffb1c5;text-align:center;padding:20px">Choosing your next surprise… ❤️</span>';
    $("imageName").textContent="A new surprise is coming…";
    renderSlots();
  }

  if(!visibleSlots.length){
    $("photoInner").innerHTML='<span style="color:#ffb1c5;text-align:center;padding:20px">All surprises have been revealed ❤️</span>';
    $("imageName").textContent="Every surprise was for you";
    return;
  }

  busy=true;
  const spinButton=$("spinBtn");
  if(spinButton){spinButton.disabled=true;spinButton.textContent="❤️";}

  // Lottery-style selection: only one tile lights up at a time.
  const targetIndex=Math.floor(Math.random()*visibleSlots.length);
  const startIndex=Math.floor(Math.random()*visibleSlots.length);
  const n=visibleSlots.length;
  const totalSteps=n*2+((targetIndex-startIndex+n)%n);
  for(let step=0;step<=totalSteps;step++){
    const tiles=[...$("slots").querySelectorAll(".slot")];
    tiles.forEach(tile=>tile.classList.remove("active"));
    const activeIndex=(startIndex+step)%n;
    if(tiles[activeIndex]) tiles[activeIndex].classList.add("active");
    const remaining=totalSteps-step;
    await wait(remaining<=2 ? 380 : remaining<=5 ? 240 : remaining<=8 ? 150 : 85);
  }

  const tiles=[...$("slots").querySelectorAll(".slot")];
  tiles.forEach(tile=>tile.classList.remove("active"));
  const chosen=visibleSlots[targetIndex];
  currentImage=chosen;

  // Reveal the winning tile, then flip the same picture into the large preview.
  if(tiles[targetIndex]) tiles[targetIndex].classList.add("active");
  await wait(250);
  renderSlots();

  $("photoInner").innerHTML="";
  const img=document.createElement("img");
  img.src=chosen.url;
  img.alt=chosen.name;
  $("photoInner").appendChild(img);
  $("imageName").textContent=chosen.name;

  busy=false;
  renderSlots();
}
$("startBtn").addEventListener("click",async()=>{
  $("welcome").classList.add("hidden");$("surprise").classList.remove("hidden");
  await loadPictures();
});
$("closeBtn").addEventListener("click",()=>{$("welcome").classList.add("hidden");$("deadPage").classList.remove("hidden");});

async function loadSongs(){
  try{
    const assets = await getAssetList();
    songs = assets.songs;
  }catch(e){
    console.warn(e);
    $("musicStatus").textContent="Could not load assets.json";
    songs = FALLBACK_SONGS.map(url=>({name:decodeURIComponent(url.split("/").pop()),url}));
  }
  if(songs.length){$("musicStatus").textContent=`♫ ${songs.length} song(s) loaded`;playSong(0,false);}
  else $("musicStatus").textContent="No songs listed in assets.json";
}
function playSong(index,autoplay=true){
  if(!songs.length){$("musicStatus").textContent="No songs found in My Songs";return;}
  currentSongIndex=(index+songs.length)%songs.length;
  audio.src=songs[currentSongIndex].url;
  $("musicStatus").textContent="♫ "+songs[currentSongIndex].name;
  if(autoplay) audio.play().then(()=>$("toggleSong").innerHTML=ICON_PAUSE).catch(()=>$("musicStatus").textContent="Tap ▶️ to start music");
  else $("toggleSong").innerHTML=ICON_PLAY;
}
$("toggleSong").addEventListener("click",()=>{
  if(!songs.length){loadSongs().then(()=>{if(songs.length)playSong(0,true);});return;}
  if(audio.paused){audio.play().then(()=>$("toggleSong").innerHTML=ICON_PAUSE).catch(()=>{});}
  else{audio.pause();$("toggleSong").innerHTML=ICON_PLAY;}
});
$("prevSong").addEventListener("click",()=>playSong(currentSongIndex-1));
$("nextSong").addEventListener("click",()=>playSong(currentSongIndex+1));
audio.addEventListener("ended",()=>playSong(currentSongIndex+1));
loadSongs(); // Load song list from assets.json on the first page too.
</script>
</body>
</html>
